name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Jellyfin requires a four-part version.
          case "$(echo "$TAG" | tr -cd '.' | wc -c)" in
            2) VERSION="$TAG.0" ;;
            3) VERSION="$TAG" ;;
            *) echo "::error::tag $GITHUB_REF_NAME is not a usable version"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          chmod +x build/package.sh
          ./build/package.sh "${{ steps.version.outputs.version }}" "${GITHUB_REF_NAME}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/finparty_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
