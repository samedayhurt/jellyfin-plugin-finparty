<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12101a">
<title>Watch Party</title>
<style>
  :root {
    --bg: #12101a;
    --surface: #1c1926;
    --surface-2: #262232;
    --line: #332e42;
    --text: #f3f0ff;
    --muted: #a49cbd;
    --accent: #ff5c8a;
    --accent-2: #7c5cff;
    --ok: #46d39a;
    --warn: #ffc857;
    --bad: #ff6b6b;
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 0%, #241d38 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }

  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 28px 0 12px; letter-spacing: -0.01em; }
  p.sub { color: var(--muted); margin: 0 0 24px; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand .dot {
    width: 34px; height: 34px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  .brand b { font-size: 17px; letter-spacing: -0.01em; }

  button {
    font: inherit; color: inherit; border: 0; background: none; cursor: pointer;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 17px 20px; border-radius: var(--radius);
    background: var(--surface-2); border: 1px solid var(--line);
    font-weight: 600; font-size: 17px; transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
  }
  .btn.ghost { background: transparent; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn + .btn { margin-top: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }

  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 15px 16px; font: inherit; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
  }
  input:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }

  .pick {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px;
  }
  .pick[aria-pressed="true"] { border-color: var(--accent); background: #2a2036; }
  .pick .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: var(--surface-2); font-size: 20px;
  }
  .pick .meta { flex: 1; min-width: 0; }
  .pick .meta b { display: block; font-size: 16px; }
  .pick .meta small { display: block; color: var(--muted); font-size: 13px; }
  .pick .check {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px;
  }
  .pick[aria-pressed="true"] .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pick[disabled] { opacity: .5; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
  }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.bad { color: var(--bad); }

  .code-display {
    font-size: 44px; font-weight: 700; letter-spacing: .18em;
    text-align: center; padding: 10px 0 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .transport { display: flex; gap: 12px; align-items: center; margin: 18px 0 8px; }
  .transport .big {
    flex: 1; padding: 22px; border-radius: 22px; font-size: 19px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .transport .side {
    width: 64px; height: 68px; border-radius: 20px; flex: none;
    background: var(--surface-2); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 20px;
  }

  .scrub { width: 100%; margin: 6px 0 2px; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

  .status {
    text-align: center; padding: 14px; border-radius: 14px; margin: 14px 0;
    background: var(--surface-2); font-weight: 600;
  }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }

  .member { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .member:first-child { border-top: 0; }
  .member .meta { flex: 1; min-width: 0; }
  .member .meta b { display: block; font-size: 15px; }
  .member .meta small { color: var(--muted); font-size: 13px; }

  .item {
    display: flex; gap: 13px; align-items: center; width: 100%; text-align: left;
    padding: 12px 14px; border-radius: 14px; background: var(--surface);
    border: 1px solid var(--line); margin-bottom: 9px;
  }
  .item .art {
    width: 46px; height: 66px; border-radius: 8px; flex: none;
    background: var(--surface-2); display: grid; place-items: center; font-size: 20px;
  }
  .item .meta { flex: 1; min-width: 0; }
  .item .meta b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta small { color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 13px 20px; border-radius: 14px; max-width: 90%;
    box-shadow: 0 12px 32px rgba(0,0,0,.45); z-index: 50;
  }
  .toast.bad { border-color: var(--bad); color: var(--bad); }

  .muted { color: var(--muted); font-size: 14px; }
  .center { text-align: center; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .hide { display: none !important; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%; margin: 30px auto;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .backlink { color: var(--muted); font-size: 15px; padding: 8px 0; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="dot">🍿</div>
    <b>Watch Party</b>
  </div>
  <div id="app"><div class="spinner"></div></div>
</div>

<script>
(() => {
  'use strict';

  const BASE = window.location.pathname.replace(/\/(index\.html)?$/, '');
  // Jellyfin may be hosted under a base path (/jellyfin, say), so the server root is
  // whatever precedes our own route rather than "/".
  const ROOT = BASE.replace(/\/FinParty$/i, '');
  const app = document.getElementById('app');

  const store = {
    get token() { return localStorage.getItem('fp.token'); },
    set token(v) { v ? localStorage.setItem('fp.token', v) : localStorage.removeItem('fp.token'); },
    get user() { return localStorage.getItem('fp.user') || ''; },
    set user(v) { localStorage.setItem('fp.user', v); },
    get deviceId() {
      let id = localStorage.getItem('fp.device');
      if (!id) {
        id = 'finparty-' + Math.random().toString(36).slice(2, 12);
        localStorage.setItem('fp.device', id);
      }
      return id;
    }
  };

  const authHeader = () =>
    `MediaBrowser Client="FinParty Remote", Device="Party Remote", DeviceId="${store.deviceId}", Version="1.0.0"` +
    (store.token ? `, Token="${store.token}"` : '');

  async function api(path, options = {}) {
    const res = await fetch(path.startsWith('/') ? path : `${BASE}/${path}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': authHeader(),
        ...(options.headers || {})
      }
    });

    if (res.status === 401) {
      store.token = null;
      renderLogin('Your session expired. Please sign in again.');
      throw new Error('unauthorized');
    }

    const text = await res.text();
    const data = text ? camelize(JSON.parse(text)) : null;

    if (!res.ok) {
      throw new Error((data && data.error) || `Something went wrong (${res.status}).`);
    }

    return data;
  }

  // Jellyfin serialises plugin API responses in PascalCase (SessionId, DeviceName),
  // matching the rest of its API. This UI is written in camelCase, so normalise every
  // key on the way in. Doing it here means no view has to care what casing the server used.
  function camelize(value) {
    if (Array.isArray(value)) return value.map(camelize);
    if (value && typeof value === 'object') {
      const out = {};
      for (const [key, v] of Object.entries(value)) {
        const camel = key.length ? key[0].toLowerCase() + key.slice(1) : key;
        out[camel] = camelize(v);
      }
      return out;
    }
    return value;
  }

  let toastTimer;
  function toast(message, bad = false) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast' + (bad ? ' bad' : '');
    el.textContent = message;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 4200);
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const time = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
             : `${m}:${String(sec).padStart(2, '0')}`;
  };

  const deviceIcon = name => {
    const n = (name || '').toLowerCase();
    if (n.includes('tv') || n.includes('roku') || n.includes('fire') || n.includes('shield')) return '📺';
    if (n.includes('phone') || n.includes('pixel') || n.includes('galaxy') || n.includes('iphone')) return '📱';
    if (n.includes('pad') || n.includes('tab')) return '📓';
    return '🖥️';
  };

  const qualityChip = (quality, ms) => {
    if (!quality || quality === 'unknown') return '<span class="chip">checking…</span>';
    const cls = quality === 'excellent' || quality === 'good' ? 'ok'
              : quality === 'fair' ? 'warn' : 'bad';
    const label = { excellent: 'great', good: 'good', fair: 'okay', poor: 'slow' }[quality] || quality;
    return `<span class="chip ${cls}">${label}${ms > 0 ? ` · ${ms}ms` : ''}</span>`;
  };

  // ---------------------------------------------------------------- login

  function renderLogin(message) {
    stopPolling();
    app.innerHTML = `
      <h1>Sign in</h1>
      <p class="sub">Use the same name and password you use to watch.</p>
      ${message ? `<div class="card" style="border-color:var(--warn);color:var(--warn)">${esc(message)}</div>` : ''}
      <div class="card">
        <label class="field"><span>Your name</span>
          <input id="u" autocomplete="username" autocapitalize="none" value="${esc(store.user)}"></label>
        <label class="field"><span>Password</span>
          <input id="p" type="password" autocomplete="current-password"></label>
        <button class="btn primary" id="go">Sign in</button>
      </div>`;

    const submit = async () => {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      if (!username) return toast('Enter your name first.', true);

      const btn = document.getElementById('go');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch(`${ROOT}/Users/AuthenticateByName`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': authHeader() },
          body: JSON.stringify({ Username: username, Pw: password })
        });

        if (!res.ok) throw new Error('That name or password did not work.');

        const data = await res.json();
        store.token = data.AccessToken;
        store.user = username;
        renderHome();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        toast(err.message, true);
      }
    };

    document.getElementById('go').onclick = submit;
    document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') submit(); };
  }

  // ---------------------------------------------------------------- home

  async function renderHome() {
    stopPolling();
    app.innerHTML = '<div class="spinner"></div>';

    let parties = [];
    try {
      parties = await api('api/parties');
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast(err.message, true);
    }

    const live = parties.map(p => `
      <button class="pick" data-group="${esc(p.groupId)}">
        <div class="avatar">🎬</div>
        <div class="meta">
          <b>${esc(p.name)}</b>
          <small>${p.members.length} watching · code ${esc(p.code)}</small>
        </div>
        <div class="check">›</div>
      </button>`).join('');

    app.innerHTML = `
      <h1>Hi ${esc(store.user)} 👋</h1>
      <p class="sub">Start a party and everyone's TV joins by itself.</p>

      <button class="btn primary" id="start">🎬 Start a watch party</button>
      <button class="btn" id="join">🔑 Join with a code</button>

      ${live ? `<h2>Happening now</h2>${live}` : ''}

      <h2>Something not right?</h2>
      <button class="btn ghost" id="doctor">🩺 Check everyone's connection</button>
      <p class="center" style="margin-top:22px">
        <a class="backlink" href="#" id="out">Sign out</a>
      </p>`;

    document.getElementById('start').onclick = renderPickDevices;
    document.getElementById('join').onclick = renderJoinCode;
    document.getElementById('doctor').onclick = renderDoctor;
    document.getElementById('out').onclick = e => {
      e.preventDefault();
      store.token = null;
      renderLogin();
    };

    app.querySelectorAll('[data-group]').forEach(el => {
      el.onclick = () => renderParty(el.dataset.group);
    });
  }

  // ---------------------------------------------------------------- join by code

  function renderJoinCode() {
    app.innerHTML = `
      <a class="backlink" href="#" id="back">‹ Back</a>
      <h1>Join a party</h1>
      <p class="sub">Ask whoever started it for the four-letter code.</p>
      <div class="card">
        <label class="field"><span>Party code</span>
          <input id="code" autocapitalize="characters" autocomplete="off"
                 maxlength="8" style="text-transform:uppercase;font-size:26px;letter-spacing:.2em;text-align:center"></label>
        <button class="btn primary" id="go">Join</button>
      </div>`;

    document.getElementById('back').onclick = e => { e.preventDefault(); renderHome(); };

    const go = async () => {
      const code = document.getElementById('code').value.trim();
      if (!code) return toast('Enter the code.', true);
      try {
        const party = await api(`api/code/${encodeURIComponent(code)}`);
        renderParty(party.groupId);
      } catch (err) {
        if (err.message !== 'unauthorized') toast(err.message, true);
      }
    };

    document.getElementById('go').onclick = go;
    document.getElementById('code').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  // ---------------------------------------------------------------- pick devices

  const selected = new Set();

  async function renderPickDevices() {
    selected.clear();
    app.innerHTML = '<div class="spinner"></div>';

    let devices = [];
    try {
      devices = await api('api/devices');
    } catch (err) {
      if (err.message === 'unauthorized') return;
      return toast(err.message, true);
    }

    if (!devices.length) {
      app.innerHTML = `
        <a class="backlink" href="#" id="back">‹ Back</a>
        <h1>Nobody's around</h1>
        <p class="sub">Open the app on a TV or phone first, then come back here. Devices show up as
        soon as they're awake.</p>
        <button class="btn" id="again">Look again</button>`;
      document.getElementById('back').onclick = e => { e.preventDefault(); renderHome(); };
      document.getElementById('again').onclick = renderPickDevices;
      return;
    }

    app.innerHTML = `
      <a class="backlink" href="#" id="back">‹ Back</a>
      <h1>Who's watching?</h1>
      <p class="sub">Tap everyone who should join. Their app will switch over on its own.</p>
      <div id="list">${devices.map(d => `
        <button class="pick" aria-pressed="false" data-id="${esc(d.sessionId)}" ${d.inParty ? 'disabled' : ''}>
          <div class="avatar">${deviceIcon(d.deviceName + ' ' + d.client)}</div>
          <div class="meta">
            <b>${esc(d.deviceName)}</b>
            <small>${esc(d.userName)} ${qualityChip(d.linkQuality, d.latencyMs)}
              ${d.inParty ? '<span class="chip warn">already in a party</span>' : ''}</small>
          </div>
          <div class="check">✓</div>
        </button>`).join('')}</div>
      <button class="btn primary" id="next" disabled>Next: pick something to watch</button>`;

    document.getElementById('back').onclick = e => { e.preventDefault(); renderHome(); };

    const next = document.getElementById('next');
    app.querySelectorAll('.pick[data-id]').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        const on = el.getAttribute('aria-pressed') === 'true';
        el.setAttribute('aria-pressed', String(!on));
        on ? selected.delete(id) : selected.add(id);
        next.disabled = selected.size === 0;
        next.textContent = selected.size
          ? `Next: pick something to watch (${selected.size})`
          : 'Next: pick something to watch';
      };
    });

    next.onclick = renderPickMedia;
  }

  // ---------------------------------------------------------------- pick media

  async function renderPickMedia() {
    app.innerHTML = `
      <a class="backlink" href="#" id="back">‹ Back</a>
      <h1>What are we watching?</h1>
      <div class="card" style="padding:12px">
        <input id="q" placeholder="Search your library…" autocomplete="off">
      </div>
      <div id="results"><div class="spinner"></div></div>
      <button class="btn ghost" id="skip">Skip — just get everyone together</button>`;

    document.getElementById('back').onclick = e => { e.preventDefault(); renderPickDevices(); };
    document.getElementById('skip').onclick = () => createParty(null);

    const results = document.getElementById('results');

    const load = async term => {
      results.innerHTML = '<div class="spinner"></div>';
      try {
        const items = await api(`api/library${term ? `?q=${encodeURIComponent(term)}` : ''}`);
        results.innerHTML = items.length
          ? items.map(i => `
              <button class="item" data-id="${esc(i.id)}">
                <div class="art">${i.type === 'Episode' ? '📺' : '🎞️'}</div>
                <div class="meta">
                  <b>${esc(i.name)}</b>
                  <small>${esc(i.subtitle || i.type)}</small>
                </div>
              </button>`).join('')
          : '<p class="muted center">Nothing found. Try a different word.</p>';

        results.querySelectorAll('[data-id]').forEach(el => {
          el.onclick = () => createParty(el.dataset.id);
        });
      } catch (err) {
        if (err.message !== 'unauthorized') results.innerHTML =
          `<p class="muted center">${esc(err.message)}</p>`;
      }
    };

    let debounce;
    document.getElementById('q').oninput = e => {
      clearTimeout(debounce);
      const term = e.target.value.trim();
      debounce = setTimeout(() => load(term), 280);
    };

    load('');
  }

  async function createParty(itemId) {
    app.innerHTML = '<div class="spinner"></div><p class="center muted">Getting everyone together…</p>';

    try {
      const body = {
        sessionIds: [...selected],
        itemId: itemId || null,
        name: `${store.user}'s watch party`
      };
      const res = await api('api/parties', { method: 'POST', body: JSON.stringify(body) });

      const failed = Object.keys(res.invites.failed || {}).length;
      if (failed) toast(`${failed} device${failed > 1 ? 's' : ''} could not join.`, true);

      renderParty(res.party.groupId);
    } catch (err) {
      if (err.message === 'unauthorized') return;
      toast(err.message, true);
      renderPickDevices();
    }
  }

  // ---------------------------------------------------------------- party room

  let pollTimer = null;
  let scrubbing = false;

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  async function renderParty(groupId) {
    stopPolling();
    app.innerHTML = '<div class="spinner"></div>';

    const paint = state => {
      const playing = state.state === 'Playing';
      const waiting = state.anyoneBuffering;
      const stuck = state.members.filter(m => m.isBuffering);

      let statusText, statusClass;
      if (waiting) {
        statusClass = 'warn';
        statusText = stuck.length === 1
          ? `Waiting for ${esc(stuck[0].userName || stuck[0].deviceName)}…`
          : `Waiting for ${stuck.length} people…`;
      } else if (playing) {
        statusClass = 'ok';
        statusText = 'Everyone\'s watching together ✨';
      } else {
        statusClass = '';
        statusText = state.nowPlaying ? 'Paused' : 'Ready when you are';
      }

      app.innerHTML = `
        <a class="backlink" href="#" id="back">‹ Home</a>
        <h1>${esc(state.name)}</h1>
        <p class="sub">Anyone can join by entering this code</p>
        <div class="code-display">${esc(state.code)}</div>

        <div class="card">
          <b>${esc(state.nowPlaying || 'Nothing playing yet')}</b>
          <input class="scrub" type="range" id="scrub" min="0"
                 max="${Math.max(1, Math.floor(state.runtimeSeconds || 1))}"
                 value="${Math.floor(state.positionSeconds || 0)}"
                 ${state.nowPlaying ? '' : 'disabled'}>
          <div class="times">
            <span>${time(state.positionSeconds)}</span>
            <span>${state.runtimeSeconds ? time(state.runtimeSeconds) : '--:--'}</span>
          </div>

          <div class="transport">
            <button class="side" id="back10" title="Back 10 seconds">⏪</button>
            <button class="big" id="toggle">${playing ? '⏸ Pause' : '▶ Play'}</button>
            <button class="side" id="fwd10" title="Forward 10 seconds">⏩</button>
          </div>

          <div class="status ${statusClass}">${statusText}</div>
        </div>

        <h2>In the party</h2>
        <div class="card">
          ${state.members.map(m => `
            <div class="member">
              <div class="avatar" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)">
                ${deviceIcon(m.deviceName)}
              </div>
              <div class="meta">
                <b>${esc(m.userName || m.deviceName)}</b>
                <small>${esc(m.deviceName)} ${qualityChip(m.linkQuality, m.latencyMs)}
                  ${m.isBuffering ? '<span class="chip warn">loading…</span>' : ''}
                  ${m.released ? '<span class="chip">catching up on their own</span>' : ''}</small>
              </div>
              <button class="chip" data-kick="${esc(m.sessionId)}">remove</button>
            </div>`).join('') || '<p class="muted center">Nobody here yet.</p>'}
        </div>

        <div class="row">
          <button class="btn" id="add">➕ Add a device</button>
          <button class="btn" id="end">✖ End party</button>
        </div>

        ${state.tuning ? `<p class="muted center" style="margin-top:18px">
          ${esc(state.tuning.explanation)}</p>` : ''}`;

      document.getElementById('back').onclick = e => { e.preventDefault(); renderHome(); };

      document.getElementById('toggle').onclick = async () => {
        try {
          await api(`api/parties/${groupId}/${playing ? 'pause' : 'resume'}`, { method: 'POST' });
          refresh();
        } catch (err) { if (err.message !== 'unauthorized') toast(err.message, true); }
      };

      const seekTo = async seconds => {
        try {
          await api(`api/parties/${groupId}/seek`, {
            method: 'POST',
            body: JSON.stringify({ positionSeconds: Math.max(0, seconds) })
          });
          refresh();
        } catch (err) { if (err.message !== 'unauthorized') toast(err.message, true); }
      };

      document.getElementById('back10').onclick = () => seekTo((state.positionSeconds || 0) - 10);
      document.getElementById('fwd10').onclick = () => seekTo((state.positionSeconds || 0) + 10);

      const scrub = document.getElementById('scrub');
      scrub.oninput = () => { scrubbing = true; };
      scrub.onchange = () => { scrubbing = false; seekTo(Number(scrub.value)); };

      document.getElementById('add').onclick = () => renderAddDevices(groupId);

      document.getElementById('end').onclick = async () => {
        if (!confirm('Stop the party for everyone?')) return;
        try {
          await api(`api/parties/${groupId}/end`, { method: 'POST' });
          toast('Party ended.');
          renderHome();
        } catch (err) { if (err.message !== 'unauthorized') toast(err.message, true); }
      };

      app.querySelectorAll('[data-kick]').forEach(el => {
        el.onclick = async () => {
          try {
            await api(`api/parties/${groupId}/members/${encodeURIComponent(el.dataset.kick)}`,
              { method: 'DELETE' });
            refresh();
          } catch (err) { if (err.message !== 'unauthorized') toast(err.message, true); }
        };
      });
    };

    const refresh = async () => {
      if (scrubbing) return;
      try {
        paint(await api(`api/parties/${groupId}`));
      } catch (err) {
        if (err.message === 'unauthorized') return;
        stopPolling();
        toast(err.message, true);
        renderHome();
      }
    };

    await refresh();
    pollTimer = setInterval(refresh, 2000);
  }

  async function renderAddDevices(groupId) {
    stopPolling();
    app.innerHTML = '<div class="spinner"></div>';

    let devices = [];
    try {
      devices = (await api('api/devices')).filter(d => !d.inParty);
    } catch (err) {
      if (err.message === 'unauthorized') return;
      return toast(err.message, true);
    }

    app.innerHTML = `
      <a class="backlink" href="#" id="back">‹ Back to party</a>
      <h1>Add a device</h1>
      ${devices.length ? devices.map(d => `
        <button class="pick" data-id="${esc(d.sessionId)}">
          <div class="avatar">${deviceIcon(d.deviceName + ' ' + d.client)}</div>
          <div class="meta">
            <b>${esc(d.deviceName)}</b>
            <small>${esc(d.userName)} ${qualityChip(d.linkQuality, d.latencyMs)}</small>
          </div>
          <div class="check">＋</div>
        </button>`).join('')
        : '<p class="muted center">Everyone available is already in.</p>'}`;

    document.getElementById('back').onclick = e => { e.preventDefault(); renderParty(groupId); };

    app.querySelectorAll('[data-id]').forEach(el => {
      el.onclick = async () => {
        try {
          await api(`api/parties/${groupId}/invite`, {
            method: 'POST',
            body: JSON.stringify({ sessionIds: [el.dataset.id] })
          });
          renderParty(groupId);
        } catch (err) { if (err.message !== 'unauthorized') toast(err.message, true); }
      };
    });
  }

  // ---------------------------------------------------------------- doctor

  async function renderDoctor() {
    stopPolling();
    app.innerHTML = '<div class="spinner"></div>';

    let report;
    try {
      report = await api('api/health');
    } catch (err) {
      if (err.message === 'unauthorized') return;
      return toast(err.message, true);
    }

    const icon = s => s === 'ok' ? '✅' : s === 'warn' ? '⚠️' : '🛑';

    app.innerHTML = `
      <a class="backlink" href="#" id="back">‹ Home</a>
      <h1>Connection check</h1>
      <p class="sub">What the server can see about everyone's link right now.</p>

      ${report.findings.map(f => `
        <div class="card">
          <b>${icon(f.severity)} ${esc(f.title)}</b>
          <p class="muted" style="margin:8px 0 0">${esc(f.detail)}</p>
          <p style="margin:10px 0 0;font-size:14px">${esc(f.fix)}</p>
        </div>`).join('')}

      <h2>Devices</h2>
      <div class="card">
        ${report.links.length ? report.links.map(l => `
          <div class="member">
            <div class="meta">
              <b>${esc(l.device)}</b>
              <small>${esc(l.user)} · ${esc(l.link)} ${qualityChip(l.quality, l.latencyMs)}
                ${l.transcoding ? '<span class="chip warn">transcoding</span>' : ''}</small>
            </div>
          </div>`).join('') : '<p class="muted center">No devices online.</p>'}
      </div>`;

    document.getElementById('back').onclick = e => { e.preventDefault(); renderHome(); };
  }

  // ---------------------------------------------------------------- boot

  if (store.token) {
    renderHome();
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
